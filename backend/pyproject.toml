[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defectlens"
version = "1.0.0"
description = "DefectLens - local-first AI visual defect inspection platform (backend + ML core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
# Runtime dependencies (exact pins live in requirements.lock).
# PyTorch/torchvision are installed separately from the CPU or CUDA index, see README.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.3",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  "httpx>=0.27",
  "reportlab>=4.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "torchvision>=0.18"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
defectml = "defectml.cli:main"
defectlens = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "defectml*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are used in tests
  "S311",   # non-crypto RNG is fine for data augmentation/splits
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012",
  "S603", "S607",
  "UP017",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "B017"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
packages = ["app", "defectml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not slow\""
markers = [
  "slow: tests that train real feature-based models (need torchvision weights)",
  "visa: tests that need the real VisA dataset prepared locally",
]
filterwarnings = ["ignore::DeprecationWarning"]

[project.urls]
Homepage = "https://github.com/sanjaymouraly/manufacturing-visual-defect-detection"
Repository = "https://github.com/sanjaymouraly/manufacturing-visual-defect-detection"
Issues = "https://github.com/sanjaymouraly/manufacturing-visual-defect-detection/issues"
